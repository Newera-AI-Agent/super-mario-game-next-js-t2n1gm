name: Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: "build-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Initialize diagnostics
        run: printf '' > build.log

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bun (if bun lockfile exists)
        if: hashFiles('bun.lock', 'bun.lockb') != ''
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Enable Corepack
        if: hashFiles('pnpm-lock.yaml', 'yarn.lock') != ''
        run: corepack enable 2>&1 | tee -a build.log

      - name: Detect build strategy
        id: pm
        run: |
          if [ -f .newera/build.sh ]; then
            echo "manager=custom" >> $GITHUB_OUTPUT
          elif [ ! -f package.json ]; then
            echo "manager=none" >> $GITHUB_OUTPUT
          elif [ -f bun.lock ] || [ -f bun.lockb ]; then echo "manager=bun" >> $GITHUB_OUTPUT
          elif [ -f pnpm-lock.yaml ]; then echo "manager=pnpm" >> $GITHUB_OUTPUT
          elif [ -f yarn.lock ]; then echo "manager=yarn" >> $GITHUB_OUTPUT
          else echo "manager=npm" >> $GITHUB_OUTPUT; fi
          echo "Detected build strategy: $(tail -n1 $GITHUB_OUTPUT)" | tee -a build.log

      - name: Install deps (npm)
        if: steps.pm.outputs.manager == 'npm'
        run: (npm ci || npm install) 2>&1 | tee -a build.log

      - name: Install deps (bun)
        if: steps.pm.outputs.manager == 'bun'
        run: (bun install --frozen-lockfile || bun install) 2>&1 | tee -a build.log

      - name: Install deps (pnpm)
        if: steps.pm.outputs.manager == 'pnpm'
        run: (pnpm install --frozen-lockfile || pnpm install) 2>&1 | tee -a build.log

      - name: Install deps (yarn)
        if: steps.pm.outputs.manager == 'yarn'
        run: (yarn install --immutable || yarn install --frozen-lockfile || yarn install) 2>&1 | tee -a build.log

      - name: Build
        id: build
        continue-on-error: true
        run: |
          set +e
          MANAGER="${{ steps.pm.outputs.manager }}"
          if [ "$MANAGER" = "custom" ]; then
            # Stack escape hatch: any toolchain (Flutter, Go, Python, ...) can
            # own its own build by committing .newera/build.sh.
            chmod +x .newera/build.sh
            ./.newera/build.sh 2>&1 | tee -a build.log
          elif [ "$MANAGER" = "none" ]; then
            echo "No package.json and no .newera/build.sh — treating the repo as static, nothing to build." | tee -a build.log
            true
          elif [ "$MANAGER" = "bun" ]; then
            bun run build 2>&1 | tee -a build.log
          elif [ "$MANAGER" = "pnpm" ]; then
            pnpm run build 2>&1 | tee -a build.log
          elif [ "$MANAGER" = "yarn" ]; then
            yarn build 2>&1 | tee -a build.log
          else
            npm run build 2>&1 | tee -a build.log
          fi
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          if [ $EXIT_CODE -eq 0 ]; then
            echo "build_status=pass" >> $GITHUB_OUTPUT
          else
            echo "build_status=fail" >> $GITHUB_OUTPUT
          fi
          exit 0

      - name: Scaffold static site output
        if: steps.pm.outputs.manager == 'none'
        run: |
          set -e
          mkdir -p .newera/out
          # A hand-written static site (index.html + css/js/assets at the repo
          # root) is a first-class project here: there is nothing to compile, so
          # the repo itself is the deployable output. Copy it into the same
          # .newera/out contract every other stack ships.
          rsync -a --exclude '.git' --exclude '.github' --exclude '.newera' \
            --exclude 'node_modules' ./ .newera/out/
          COUNT=$(find .newera/out -type f | wc -l)
          echo "Static site scaffolded into .newera/out ($COUNT file(s))." | tee -a build.log
          if [ ! -f .newera/out/index.html ]; then
            echo "::warning::No index.html at the repo root — the deploy will have no entry document." | tee -a build.log
          fi

      - name: Adapt server build for static hosting
        if: steps.build.outputs.build_status == 'pass'
        continue-on-error: true
        run: |
          set +e
          if [ -d .newera/out ] || [ -d out ] || [ -d dist ] || [ -d build ]; then
            echo "Static output already present — no adapter needed." | tee -a build.log
            exit 0
          fi
          if [ -d .next ]; then
            echo "Next.js server build detected with no static output — running @cloudflare/next-on-pages." | tee -a build.log
            npx --yes @cloudflare/next-on-pages@1 2>&1 | tee -a build.log
            if [ -d .vercel/output/static ]; then
              mkdir -p .newera
              rm -rf .newera/out
              cp -r .vercel/output/static .newera/out
              echo "Adapter output copied to .newera/out." | tee -a build.log
            else
              echo "::warning::next-on-pages produced no static output. Set output: 'export' in next.config to make this app deployable." | tee -a build.log
            fi
          fi
          exit 0

      - name: Report deployable output
        if: always()
        run: |
          for d in .newera/out out dist build; do
            if [ -d "$d" ]; then
              echo "deployable_output=$d" | tee -a build.log
              exit 0
            fi
          done
          echo "deployable_output=none — no static directory was produced; the deploy step will refuse this build." | tee -a build.log

      - name: Upload build log

        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 1
          if-no-files-found: warn

      - name: Upload build output
        if: steps.build.outputs.build_status == 'pass'
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            .newera/out
            .next
            dist
            out
            build
            public
          retention-days: 1
          if-no-files-found: ignore

      - name: Fail job if build failed
        if: steps.build.outputs.build_status == 'fail'
        run: |
          echo "::error::Build failed — see build-log artifact"
          exit 1
